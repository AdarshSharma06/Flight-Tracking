spring:
  application:
    name: flight-tracking-backend
  datasource:
    # Environment variables keep secrets out of source code.
    # Supabase example: jdbc:postgresql://db.<project>.supabase.co:5432/postgres?sslmode=require
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flight_tracking}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # Flyway manages schema; validate ensures entities match migrations
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.lob.non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: simple

server:
  port: ${PORT:8080}

app:
  jwt:
    # MUST be set via environment variable in production (Render). Base64-encoded, at least 256 bits.
    # Default below is for local development only and is NOT a real secret.
    secret: ${JWT_SECRET:bXktdmVyeS1sb25nLWRldi1qd3Qtc2VjcmV0LWtleS10aGF0LWlzLTMyLWJ5dGVzISE=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  aviationstack:
    api-key: ${AVIATIONSTACK_API_KEY:demo}
    base-url: ${AVIATIONSTACK_BASE_URL:http://api.aviationstack.com/v1}
    timeout-ms: ${AVIATIONSTACK_TIMEOUT_MS:5000}
  open-meteo:
    base-url: ${OPENMETEO_BASE_URL:https://api.open-meteo.com}
    timeout-ms: ${OPENMETEO_TIMEOUT_MS:5000}
  cors:
    # Comma-separated list, configurable via env CORS_ALLOWED_ORIGINS for production React frontend
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# OpenAPI docs (springdoc) - available at /v3/api-docs and /swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.flighttracking: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

# Render sets PORT env var; Supabase requires sslmode=require in DATABASE_URL
