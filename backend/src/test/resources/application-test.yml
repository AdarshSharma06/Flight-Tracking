spring:
  application:
    name: flight-tracking-backend
  datasource:
    # H2 in-memory for tests only - isolated from production PostgreSQL/Supabase config
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    # Flyway runs against PostgreSQL; disable for H2 tests. JPA create-drop handles schema.
    enabled: false

server:
  port: 0
